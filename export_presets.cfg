html/head_include="<script src='/sdk.js'></script>
<style>html,body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;}</style>
<script>
(function(){
  var sdk=null, player=null, ok=false, ready=false, waiting=[], onPause=null, onResume=null, myId='';
  function pause(){ if(onPause){ onPause(); } }
  function resume(){ if(onResume){ onResume(); } }
  function finish(){ ready=true; waiting.forEach(function(cb){ cb(ok); }); waiting=[]; }
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.addEventListener('visibilitychange', function(){ if(document.hidden){ pause(); } else { resume(); } });
  var boot = (typeof YaGames !== 'undefined') ? YaGames.init() : Promise.reject('Yandex SDK not loaded');
  boot.then(function(s){
    sdk=s; ok=true; window.ysdk=s;
    try { s.on('game_api_pause', pause); s.on('game_api_resume', resume); } catch(e){}
    return s.getPlayer({scopes:false}).then(function(p){ player=p; try{ myId=p.getUniqueID(); }catch(e){} }).catch(function(){});
  }).catch(function(e){ console.warn('[YG]', e); }).then(finish);

  window.YG = {
    whenReady: function(cb){ if(ready){ cb(ok); } else { waiting.push(cb); } },
    onPause: function(cb){ onPause=cb; },
    onResume: function(cb){ onResume=cb; },
    lang: function(){ try { return sdk.environment.i18n.lang; } catch(e){ return (navigator.language||'ru').slice(0,2); } },
    loadingReady: function(){ try { sdk.features.LoadingAPI.ready(); } catch(e){} },
    gameplay: function(on){ try { if(on){ sdk.features.GameplayAPI.start(); } else { sdk.features.GameplayAPI.stop(); } } catch(e){} },
    showFullscreen: function(done){
      if(!sdk){ done(false); return; }
      sdk.adv.showFullscreenAdv({callbacks:{
        onOpen: pause,
        onClose: function(shown){ resume(); done(!!shown); },
        onError: function(){ resume(); done(false); },
        onOffline: function(){ done(false); }
      }});
    },
    showRewarded: function(done){
      if(!sdk){ done(false); return; }
      var got=false;
      sdk.adv.showRewardedVideo({callbacks:{
        onOpen: pause,
        onRewarded: function(){ got=true; },
        onClose: function(){ resume(); done(got); },
        onError: function(){ resume(); done(false); }
      }});
    },
    isAuthorized: function(){
      try { return player ? (player.isAuthorized ? player.isAuthorized() : player.getMode() !== 'lite') : false; } catch(e){ return false; }
    },
    openAuth: function(done){
      if(!sdk){ done(false); return; }
      sdk.auth.openAuthDialog().then(function(){
        return sdk.getPlayer({scopes:false}).then(function(p){ player=p; try{ myId=p.getUniqueID(); }catch(e){} done(true); });
      }).catch(function(){ done(false); });
    },
    setScore: function(v){
      if(!sdk){ return; }
      try {
        if(sdk.leaderboards && sdk.leaderboards.setScore){ sdk.leaderboards.setScore('score', v); }
        else { sdk.getLeaderboards().then(function(lb){ lb.setLeaderboardScore('score', v); }); }
      } catch(e){ console.warn('[YG] setScore', e); }
    },
    getEntries: function(done){
      if(!sdk){ done(''); return; }
      var o={quantityTop:10, includeUser:true, quantityAround:3};
      var pr = (sdk.leaderboards && sdk.leaderboards.getEntries) ? sdk.leaderboards.getEntries('score', o)
        : sdk.getLeaderboards().then(function(lb){ return lb.getLeaderboardEntries('score', o); });
      pr.then(function(r){
        var rows=(r.entries||[]).map(function(e){
          var p=e.player||{};
          return {rank:e.rank, score:e.score, name:p.publicName||'', me:!!myId && p.uniqueID===myId};
        });
        done(JSON.stringify({userRank:r.userRank||0, entries:rows}));
      }).catch(function(e){ console.warn('[YG] getEntries', e); done(''); });
    },
    loadData: function(done){
      if(!player){ done(''); return; }
      player.getData().then(function(d){ done(JSON.stringify(d||{})); }).catch(function(){ done(''); });
    },
    saveData: function(json){
      if(!player){ return; }
      try { player.setData(JSON.parse(json), false); } catch(e){}
    }
  };
})();
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false

